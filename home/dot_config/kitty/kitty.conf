# =============================================================================
# kitty.conf — base config (shared across machines)
# Theme-specific overrides live in theme.conf which is included at the bottom.
# Managed by chezmoi. Edit via `chezmoi edit ~/.config/kitty/kitty.conf`.
# =============================================================================

# ---- Font ------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

# ---- Cursor ----------------------------------------------------------------
cursor_shape     beam
cursor_blink_interval 0.5

# ---- Scrollback ------------------------------------------------------------
scrollback_lines 10000

# ---- Window ----------------------------------------------------------------
window_padding_width 8
confirm_os_window_close 0

# ---- Tabs ------------------------------------------------------------------
enabled_layouts tall
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol *

# ---- Performance / Wayland-friendliness ------------------------------------
sync_to_monitor yes

# ---- Theme include ---------------------------------------------------------
# theme.conf holds machine-specific colors + wallpaper
# (Rize on laptop, Touka on workstation, etc.)
include theme.conf

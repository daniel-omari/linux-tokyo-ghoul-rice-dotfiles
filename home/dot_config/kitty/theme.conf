# =============================================================================
# theme.conf — Rize theme (laptop)
# Purples, pinks, whites — Tango Dark recolored toward lavender
# =============================================================================

# ---- Background ------------------------------------------------------------
background       #f5ecf2
background_opacity 1.0
background_tint  0.30
background_image ~/.local/share/wallpapers/rize/rize2.png
background_image_layout scaled

# ---- Foreground / cursor ---------------------------------------------------
foreground       #e8d8f0
cursor           #ff8fd8
cursor_text_color #1a1420

# ---- Selection -------------------------------------------------------------
selection_foreground #1a1420
selection_background #c898d8

# ---- Tango Dark recolored toward Rize palette ------------------------------
color0  #2e2438
color1  #cc4477
color2  #9080a8
color3  #d8a0c8
color4  #8060a0
color5  #b070d0
color6  #c898d8
color7  #e8d8f0

color8  #5a4868
color9  #ff5599
color10 #b098c8
color11 #f0c0e0
color12 #a080c0
color13 #d090f0
color14 #e8b8f0
color15 #ffe8ff
